name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchback-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install --yes osmium-tool
      - run: npm ci
      - run: npm test -- --reporter=dot

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clean production build
        run: rm -rf .next && npm run build

  critical-e2e:
    name: critical-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:critical
      - name: Upload critical E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  pwa:
    name: pwa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Clean production build
        run: rm -rf .next && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - name: Upload PWA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  road-lock:
    name: road-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=road-lock
      - name: Upload road-lock failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: road-lock-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  real-router:
    name: real-router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install --yes osmium-tool
      - run: npm ci
      - name: Install pinned GraphHopper
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location \
            --output data/graphhopper-web-11.0.jar \
            https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.0/graphhopper-web-11.0.jar
          echo 'b59c024afe172ec6ec85b6327006c3138ec58c7d0bcd26253d0e42853f613def  data/graphhopper-web-11.0.jar' | sha256sum --check
      - run: npx playwright install --with-deps chromium
      - run: scripts/qa/prepare-test-router.sh
      - name: Run real-router browser checks
        run: |
          set -euo pipefail
          trap 'scripts/qa/stop-test-router.sh' EXIT
          scripts/qa/start-test-router.sh
          GRAPHHOPPER_URL=http://127.0.0.1:8998 npm run test:e2e:real-router
      - name: Upload real-router failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-router-failure
          path: |
            test-results
            playwright-report
            data/quality/switchback-test-router.log
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual
    runs-on: ubuntu-latest
    # Evidence-only until the snapshot baseline is independent of the app's
    # time-based automatic theme selection.
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=visual
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
