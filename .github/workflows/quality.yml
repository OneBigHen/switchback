name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchback-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install --yes osmium-tool
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - name: Production build
        run: rm -rf .next && npm run build

  rider-journeys:
    name: rider-journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Critical rider journeys in Chromium
        run: npx playwright test --project=critical-chromium
      - name: WebKit compatibility smoke
        run: npx playwright test --project=critical-webkit-smoke
      - name: Road lock regression
        run: npx playwright test --project=road-lock
      - name: Upload rider journey failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rider-journeys-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  pwa-smoke:
    name: pwa-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build
        run: rm -rf .next && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - name: Upload PWA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-smoke-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Compatibility names retained for branch protection while the consolidated
  # jobs above own these exact contracts.
  typecheck-compat:
    name: typecheck
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success

  lint-compat:
    name: lint
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success

  vitest-compat:
    name: vitest
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success

  build-compat:
    name: build
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.verify.result }}" = success

  critical-e2e-compat:
    name: critical-e2e
    needs: rider-journeys
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs['rider-journeys'].result }}" = success

  road-lock-compat:
    name: road-lock
    needs: rider-journeys
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs['rider-journeys'].result }}" = success

  pwa-compat:
    name: pwa
    needs: pwa-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs['pwa-smoke'].result }}" = success

  # These protected names used to mirror rider-journeys and could pass without
  # exercising their own contract. Keep the names, but run the actual suites.
  real-router:
    name: real-router
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install --yes osmium-tool
      - run: npm ci
      - name: Install pinned GraphHopper
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location \
            --output data/graphhopper-web-11.0.jar \
            https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.0/graphhopper-web-11.0.jar
          echo 'b59c024afe172ec6ec85b6327006c3138ec58c7d0bcd26253d0e42853f613def  data/graphhopper-web-11.0.jar' | sha256sum --check
      - run: npx playwright install --with-deps chromium
      - run: scripts/qa/prepare-test-router.sh
      - name: Run real-router browser checks
        run: |
          set -euo pipefail
          trap 'scripts/qa/stop-test-router.sh' EXIT
          scripts/qa/start-test-router.sh
          GRAPHHOPPER_URL=http://127.0.0.1:8998 npm run test:e2e:real-router
      - name: Upload real-router failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-router-failure
          path: |
            test-results
            playwright-report
            data/quality/switchback-test-router.log
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run visual regression matrix without updating baselines
        run: npx playwright test --project=visual
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
