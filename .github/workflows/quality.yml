name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchback-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install --yes osmium-tool
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - name: Production build
        run: rm -rf .next && npm run build

  rider-journeys:
    name: rider-journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Critical rider journeys in Chromium
        run: npx playwright test --project=critical-chromium
      - name: WebKit compatibility smoke
        run: npx playwright test --project=critical-webkit-smoke
      - name: Road lock regression
        run: npx playwright test --project=road-lock
      - name: Upload rider journey failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rider-journeys-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  pwa-smoke:
    name: pwa-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build
        run: rm -rf .next && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pwa
      - name: Upload PWA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-smoke-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
