name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchback-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: code-quality
    runs-on: [self-hosted, linux, x64, homelab-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify fixture tools
        run: command -v osmium && java -version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: rm -rf .next
      - run: npm run build
      - name: Upload code-quality failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-code-failure
          path: |
            artifacts/quality
            test-results
          if-no-files-found: ignore
          retention-days: 7

  critical-browser:
    name: critical-browser
    runs-on: [self-hosted, linux, x64, homelab-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run test:e2e:critical
      - name: Upload critical-browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-critical-browser-failure
          path: |
            test-results
            playwright-report
            artifacts/quality
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual
    runs-on: [self-hosted, linux, x64, homelab-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --project=visual
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-visual-failure
          path: |
            test-results
            playwright-report
            tests/e2e/visual/screens.spec.ts-snapshots
            artifacts/quality
          if-no-files-found: ignore
          retention-days: 7

  real-router:
    name: real-router
    runs-on: [self-hosted, linux, x64, homelab-ci]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify fixture tools
        run: command -v osmium && java -version
      - run: npm ci
      - name: Install pinned GraphHopper
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location \
            --output data/graphhopper-web-11.0.jar \
            https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.0/graphhopper-web-11.0.jar
          echo 'b59c024afe172ec6ec85b6327006c3138ec58c7d0bcd26253d0e42853f613def  data/graphhopper-web-11.0.jar' | sha256sum --check
      - run: npx playwright install chromium
      - run: scripts/qa/prepare-test-router.sh
      - name: Run real-router browser checks
        run: |
          set -euo pipefail
          trap 'scripts/qa/stop-test-router.sh' EXIT
          scripts/qa/start-test-router.sh
          GRAPHHOPPER_URL=http://127.0.0.1:8998 npm run test:e2e:real-router
      - name: Upload real-router failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-real-router-failure
          path: |
            test-results
            playwright-report
            data/quality/switchback-test-router.log
            artifacts/quality
          if-no-files-found: ignore
          retention-days: 7

  pwa:
    name: pwa
    runs-on: [self-hosted, linux, x64, homelab-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rm -rf .next
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e:pwa
      - name: Upload PWA failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-pwa-failure
          path: |
            test-results
            playwright-report
            artifacts/quality
          if-no-files-found: ignore
          retention-days: 7

  live-smoke:
    name: live-smoke
    runs-on: [self-hosted, linux, x64, homelab-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:live-smoke
      - name: Upload live-provider report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-live-smoke
          path: |
            artifacts/quality/live-provider-results.json
            docs/quality/LIVE_PROVIDER_RESULTS.md
          if-no-files-found: ignore
          retention-days: 7

  quality-summary:
    name: quality-summary
    if: always()
    needs: [code-quality, critical-browser, visual, real-router, pwa, live-smoke]
    runs-on: [self-hosted, linux, x64, homelab-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download live-provider report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quality-live-smoke
          path: .
      - name: Write owner-facing summary
        env:
          QUALITY_CODE_QUALITY: ${{ needs.code-quality.result }}
          QUALITY_CRITICAL_BROWSER: ${{ needs.critical-browser.result }}
          QUALITY_VISUAL: ${{ needs.visual.result }}
          QUALITY_REAL_ROUTER: ${{ needs.real-router.result }}
          QUALITY_PWA: ${{ needs.pwa.result }}
          QUALITY_LIVE_SMOKE: ${{ needs.live-smoke.result }}
        run: npm run quality:summary
      - name: Publish summary in the workflow
        if: always()
        run: cat artifacts/quality/QUALITY_SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload owner-facing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-summary
          path: artifacts/quality
          if-no-files-found: ignore
          retention-days: 7
