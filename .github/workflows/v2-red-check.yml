name: V2 focused RED check

on:
  push:
    branches:
      - ux/v2-final-integration

permissions:
  contents: read

jobs:
  red-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run new UX unit contracts
        run: npx vitest run tests/components/route-decision-rail.test.tsx tests/components/ui-customization-settings.test.tsx tests/unit/free-ride-readability-css-contract.test.ts --reporter=verbose
      - name: Install Chromium
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Prove Discover placeholder is insufficient
        if: always()
        run: npx playwright test tests/e2e/critical/navigation-ia.spec.ts --project=critical-chromium --workers=1 --retries=0
