name: One-shot map-first route result fix

on:
  push:
    branches:
      - ux/v2-final-integration
    paths:
      - .github/workflows/ux-map-first-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v2-final-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prove route-result map regression and fix it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/components/planner-deck.test.tsx')
          text = path.read_text()
          marker = '  it("returns the viewport to route choices when planning finishes after editing", async () => {'
          next_marker = '  it("shows Choose and returns to the route rack while alternatives are still loading", async () => {'
          start = text.find(marker)
          end = text.find(next_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('mobile route-result test block not found')
          block = text[start:end]
          user_line = '    const user = userEvent.setup()\n'
          if block.count(user_line) != 1:
              raise SystemExit(f'expected one user setup line, found {block.count(user_line)}')
          block = block.replace(user_line, user_line + '    stubPhoneViewport()\n', 1)
          needle = '      expect(screen.getByRole("heading", { name: "Choose a route" })).toBeInTheDocument()\n'
          position = block.rfind(needle)
          if position < 0:
              raise SystemExit('route choice assertion not found')
          insert_at = position + len(needle)
          block = block[:insert_at] + '      expect(usePlannerStore.getState().sheetDetentOverride).toBe("half")\n' + block[insert_at:]
          path.write_text(text[:start] + block + text[end:])
          PY

          set +e
          npm test -- tests/components/planner-deck.test.tsx --reporter=dot 2>&1 | tee /tmp/planner-red.log
          red_status=${PIPESTATUS[0]}
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo "Expected map-first regression test to fail before production fix"
            exit 1
          fi
          grep -q 'half' /tmp/planner-red.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/components/planner-deck.test.tsx
          git commit -m "test(planner): keep map visible for route choices"

          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/planner/PlannerDeck.tsx')
          text = path.read_text()
          old = 'if (isPhoneViewport()) setSheetDetentOverride("full")'
          new = 'if (isPhoneViewport()) setSheetDetentOverride("half")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one phone result detent, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          npm test -- tests/components/planner-deck.test.tsx --reporter=dot
          rm .github/workflows/ux-map-first-one-shot.yml
          git add src/components/planner/PlannerDeck.tsx .github/workflows/ux-map-first-one-shot.yml
          git diff --cached --check
          git commit -m "fix(planner): keep route results map-first on phones"
          git push origin HEAD:ux/v2-final-integration
