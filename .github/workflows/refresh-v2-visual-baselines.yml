name: Refresh V2 visual baselines

on:
  push:
    branches:
      - ux/v2-final-integration
    paths:
      - .github/workflows/refresh-v2-visual-baselines.yml

permissions:
  contents: write

# Temporary release-candidate helper. Remove after the approved Linux baselines
# are regenerated successfully on the same runner image used by Deep QA.
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v2-final-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate Linux visual baselines
        run: npx playwright test --project=visual --update-snapshots
      - name: Commit regenerated baselines
        shell: bash
        run: |
          set -euo pipefail
          git add 'tests/e2e/visual/**/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo 'No visual baseline changes were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(visual): refresh approved V2 Linux baselines'
          git push origin HEAD:ux/v2-final-integration
