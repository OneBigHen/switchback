name: Mobile QA (nightly)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchback-mobile-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-core:
    name: mobile-core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Core mobile behavior matrix
        run: npm run test:e2e:mobile-qa
      - name: Upload mobile QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-core
          path: artifacts/mobile-qa
          if-no-files-found: ignore
          retention-days: 14
