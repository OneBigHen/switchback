name: Mobile QA Level A

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly FULL gate, deliberately off the :00 push rush (06:17 UTC).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchback-mobile-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-qa:
    name: WebKit and Chromium mobile QA
    runs-on: ubuntu-latest
    # FAST (50) + PREPARE (7) + FULL (110) on one worker. The original 25 was
    # calibrated while the suite still failed early; a fully passing run needs
    # roughly 28 minutes, so give it headroom rather than cancelling mid-FULL.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:mobile-qa
      - name: Mobile QA PREPARE
        env:
          MOBILE_QA_ARTIFACT_ROOT: artifacts/mobile-qa/runs/prepare-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:e2e:mobile-qa:prepare
      - name: Mobile QA FULL
        # The deterministic core (FAST + PREPARE) is the required merge and
        # release gate. The expanded multi-viewport FULL matrix stays visible
        # but advisory on PR/push runs — one Linux-WebKit timing hiccup must
        # not halt development — and is required on the nightly gate, where no
        # merge is waiting on the result.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        env:
          MOBILE_QA_ARTIFACT_ROOT: artifacts/mobile-qa/runs/full-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:e2e:mobile-qa:expanded
      - name: Upload complete mobile QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-level-a
          path: artifacts/mobile-qa
          if-no-files-found: error
          retention-days: 14
