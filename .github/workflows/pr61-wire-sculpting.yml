name: PR61 wire sculpting integration

on:
  push:
    branches: [ux/map-native-route-sculpting]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/map-native-route-sculpting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply map sculpt integration
        run: python scripts/qa/patch-pr61-route-sculpting.py
      - name: Verify sculpting integration
        run: |
          npm run typecheck
          npx vitest run tests/unit/route-sculpting-state.test.ts tests/components/route-sculpt-road-lock.test.tsx tests/components/route-map-comparison.test.tsx --reporter=dot
      - name: Commit integration and remove temporary patch helpers
        run: |
          rm .github/workflows/pr61-wire-sculpting.yml scripts/qa/patch-pr61-route-sculpting.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planner/PlannerMapStage.tsx src/components/planner/PlannerShell.tsx .github/workflows/pr61-wire-sculpting.yml scripts/qa/patch-pr61-route-sculpting.py
          git commit -m "feat: sculpt selected routes directly on the map"
          git push origin HEAD:ux/map-native-route-sculpting
