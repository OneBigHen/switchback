name: Patch Goblin route preview

on:
  push:
    branches:
      - ux/map-native-route-comparison

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/map-native-route-comparison
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/qa/patch-goblin-route-preview.py
      - name: Verify Goblin preview contract
        run: |
          npm run typecheck
          npx vitest run tests/components/gravel-goblin-opinion.test.tsx --reporter=dot
      - name: Commit patch and remove temporary helpers
        run: |
          rm .github/workflows/patch-goblin-route-preview.yml scripts/qa/patch-goblin-route-preview.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planner/v2/RideAdvisor.tsx .github/workflows/patch-goblin-route-preview.yml scripts/qa/patch-goblin-route-preview.py
          git commit -m "feat: preview Gravel Goblin route picks on the map"
          git push origin HEAD:ux/map-native-route-comparison
