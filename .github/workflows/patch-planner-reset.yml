name: One-shot Planner reset patch

on:
  push:
    branches:
      - ux/v2-final-integration
    paths:
      - .github/workflows/patch-planner-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v2-final-integration
          fetch-depth: 0
      - name: Apply exact reset callback patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/planner/PlannerShell.tsx')
          text = path.read_text()
          old = '''          onResetLearning={() => {
            if (!window.confirm("Reset all learned preferences? This cannot be undone.")) return
            void riderPreferenceLibraryRef.current!.clear()
          }}'''
          new = '''          onResetLearning={() => riderPreferenceLibraryRef.current!.clear()}'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one reset callback, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-planner-reset.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/planner/PlannerShell.tsx .github/workflows/patch-planner-reset.yml
          git diff --cached --check
          git commit -m "fix(settings): propagate learning reset failures"
          git push origin HEAD:ux/v2-final-integration
