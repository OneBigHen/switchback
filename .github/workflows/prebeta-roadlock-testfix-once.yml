name: Prebeta road-lock testfix once

on:
  push:
    branches:
      - fix/prebeta-hold-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prebeta-hold-20260906
          fetch-depth: 0
      - name: Update stale V1 role assertion to V2 combobox contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/road-lock.spec.ts')
          text = p.read_text()
          old = '  await expect(page.getByRole("textbox", { name: "Ride request" })).toBeVisible()\n'
          new = '  await expect(page.getByRole("combobox", { name: "Ride request" })).toBeVisible()\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Ride request textbox assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/prebeta-roadlock-testfix-once.yml
          git diff --check
      - name: Commit road-lock test contract fix
        shell: bash
        run: |
          git config user.name "switchback-ci"
          git config user.email "switchback-ci@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "test road lock against current V2 ride request role"
          git push origin HEAD:fix/prebeta-hold-20260906
