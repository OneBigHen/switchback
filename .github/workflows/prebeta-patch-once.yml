name: Prebeta patch once

on:
  push:
    branches:
      - fix/prebeta-hold-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prebeta-hold-20260906
          fetch-depth: 0
      - name: Apply exact recovery patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # A newer free-form request is explicitly allowed by PlanComposer while
          # routing. PlannerDeck accidentally serialized it anyway.
          replace(
              "src/components/planner/PlannerDeck.tsx",
              '    if (prompt.length < 3 || intentStatus === "interpreting" || planningActive) return\n',
              '    if (prompt.length < 3 || intentStatus === "interpreting") return\n'
          )

          # The map owns the raw finger stroke, so submission must report whether
          # routing actually accepted it and Cancel needs an explicit rollback hook.
          replace(
              "src/components/planner/map-stage-props.ts",
              'export interface MapStageProps {\n',
              'export interface RouteSketchResult {\n  ok: boolean\n  code?: string\n  message?: string\n}\n\nexport interface MapStageProps {\n'
          )
          replace(
              "src/components/planner/map-stage-props.ts",
              '  onRouteSketch(trace: Waypoint[]): void\n  onSketchModeChange(active: boolean): void\n',
              '  onRouteSketch(trace: Waypoint[]): Promise<RouteSketchResult>\n  onSketchCancel?(): void\n  onSketchModeChange(active: boolean): void\n'
          )

          # Planning already returns null on a fenced/provider failure. Preserve that
          # result so the sketch path cannot publish a success toast after failure.
          replace(
              "src/components/planner/PlannerShell.tsx",
              '''  const handlePlan = async () => {
    const current = usePlannerStore.getState()
    try {
      loopSeed.current += 1
      const customSegmentProfiles = current.mode === "destination" && current.segmentProfiles.some((item) => item !== current.profile)
        ? normalizedSegmentProfiles(current.segmentProfiles, current.via.length + 1, current.profile)
        : undefined
      await runTripPlan(buildRideTripRequest({
        mode: current.mode,
        start: current.start,
        finish: current.finish,
        profile: current.profile,
        bikeProfile: current.bikeProfile,
        roadLocks: current.roadLocks,
        targetMinutes: current.targetMinutes,
        timeShaped: current.timeShaped,
        seed: loopSeed.current,
        via: current.via,
