              '''  const handleRouteSketch = async (trace: Waypoint[]) => {
    routeRequestGate.invalidate()
    try {
      const current = usePlannerStore.getState()
      const intent = routeIntentFromSketch({
        currentMode: current.mode,
        start: current.start,
        finish: current.finish,
