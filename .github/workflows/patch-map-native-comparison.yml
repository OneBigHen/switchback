name: Patch map-native comparison

on:
  push:
    branches:
      - ux/map-native-route-comparison

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/map-native-route-comparison
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch PlannerMapStage
        run: python scripts/qa/patch-map-native-comparison.py
      - name: Verify focused contract
        run: |
          npm run typecheck
          npx vitest run tests/components/route-map-comparison.test.tsx tests/components/route-decision-rail.test.tsx --reporter=dot
      - name: Commit patch and remove temporary helpers
        run: |
          rm .github/workflows/patch-map-native-comparison.yml scripts/qa/patch-map-native-comparison.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planner/PlannerMapStage.tsx .github/workflows/patch-map-native-comparison.yml scripts/qa/patch-map-native-comparison.py
          git commit -m "feat: wire map-native route preview and selection"
          git push origin HEAD:ux/map-native-route-comparison
