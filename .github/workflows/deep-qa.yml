name: Deep QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switchback-deep-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-webkit:
    name: full-webkit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Full critical rider journeys in WebKit
        run: npx playwright test --project=critical-webkit-full
      - name: Upload WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deep-qa-webkit-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual-deep-qa
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run visual regression matrix without updating baselines
        run: npx playwright test --project=visual
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deep-qa-visual-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  real-router:
    name: real-router-deep-qa
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install fixture tools
        run: sudo apt-get update && sudo apt-get install --yes osmium-tool
      - run: npm ci
      - name: Install pinned GraphHopper
        run: |
          mkdir -p data
          curl --fail --silent --show-error --location \
            --output data/graphhopper-web-11.0.jar \
            https://repo1.maven.org/maven2/com/graphhopper/graphhopper-web/11.0/graphhopper-web-11.0.jar
          echo 'b59c024afe172ec6ec85b6327006c3138ec58c7d0bcd26253d0e42853f613def  data/graphhopper-web-11.0.jar' | sha256sum --check
      - run: npx playwright install --with-deps chromium
      - run: scripts/qa/prepare-test-router.sh
      - name: Run real-router browser checks
        run: |
          set -euo pipefail
          trap 'scripts/qa/stop-test-router.sh' EXIT
          scripts/qa/start-test-router.sh
          GRAPHHOPPER_URL=http://127.0.0.1:8998 npm run test:e2e:real-router
      - name: Upload real-router failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deep-qa-real-router-failure
          path: |
            test-results
            playwright-report
            data/quality/switchback-test-router.log
          if-no-files-found: ignore
          retention-days: 7
