name: Pre-beta reviewed visual refresh

on:
  push:
    branches:
      - fix/prebeta-hold-20260906
    paths:
      - .github/workflows/prebeta-refresh-goblin-snapshot.yml

permissions:
  contents: write

jobs:
  refresh-reviewed-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prebeta-hold-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Refresh only the reviewed routed-companion phone baseline
        run: >-
          npx playwright test tests/e2e/visual/gravel-goblin.spec.ts
          --project=visual
          --grep "Gravel Goblin phone.*routed companion"
          --update-snapshots
      - name: Prove snapshot scope
        shell: bash
        run: |
          set -euo pipefail
          expected='tests/e2e/visual/gravel-goblin.spec.ts-snapshots/gravel-goblin-routed-phone-visual-linux.png'
          # Next can refresh this generated declaration while the dev server boots;
          # it is not part of the reviewed visual change.
          git restore -- next-env.d.ts
          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Reviewed baseline is already current.'
            exit 0
          fi
          if [[ "$changed" != "$expected" ]]; then
            echo 'Refusing to commit unexpected snapshot changes:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit reviewed baseline
        shell: bash
        run: |
          set -euo pipefail
          expected='tests/e2e/visual/gravel-goblin.spec.ts-snapshots/gravel-goblin-routed-phone-visual-linux.png'
          if git diff --quiet -- "$expected"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$expected"
          git commit -m 'test(visual): accept routed companion V2 baseline'
          git push origin HEAD:fix/prebeta-hold-20260906
