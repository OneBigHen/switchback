name: Prebeta typefix once

on:
  push:
    branches:
      - fix/prebeta-hold-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prebeta-hold-20260906
          fetch-depth: 0
      - name: Apply exact TypeScript integration fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/components/planner/PlannerMapStage.tsx",
              'import type { MapStageProps } from "./map-stage-props"\n',
              'import type { MapStageProps } from "./map-stage-props"\nimport type { Waypoint } from "@/lib/routing/types"\n'
          )
          replace(
              "src/components/planner/PlannerShell.tsx",
              '        onRouteSculptCommit={() => handlePlan()}\n',
              '        onRouteSculptCommit={() => { void handlePlan() }}\n'
          )
          PY
          rm -f .github/workflows/prebeta-typefix-once.yml
          git diff --check
      - name: Commit final type integration fix
        shell: bash
        run: |
          git config user.name "switchback-ci"
          git config user.email "switchback-ci@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix final prebeta type integration"
          git push origin HEAD:fix/prebeta-hold-20260906
