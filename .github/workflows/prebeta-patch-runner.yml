name: Prebeta patch runner

on:
  push:
    branches:
      - fix/prebeta-hold-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prebeta-hold-20260906
          fetch-depth: 0
      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/prebeta-patch-once.yml').read_text()
          start = "          python3 - <<'PY'\n"
          end = "\n          PY\n          git diff --check"
          if start not in source or end not in source:
              raise SystemExit('embedded patch markers missing')
          body = source.split(start, 1)[1].split(end, 1)[0]
          lines = body.splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          body = body.replace(
              "def replace(path, old, new):\n    p = Path(path)",
              "replace_counter = 0\ndef replace(path, old, new):\n    global replace_counter\n    replace_counter += 1\n    p = Path(path)",
              1
          )
          body = body.replace(
              'raise SystemExit(f"{path}: expected one exact match, found {count}")',
              'raise SystemExit(f"replace #{replace_counter} {path}: expected one exact match, found {count}; old={old[:120]!r}")',
              1
          )
          Path('/tmp/prebeta_patch.py').write_text(body)
          PY
          python3 /tmp/prebeta_patch.py
          rm -f .github/workflows/prebeta-patch-runner.yml
          git diff --check
      - name: Commit recovery patch
        shell: bash
        run: |
          git config user.name "switchback-ci"
          git config user.email "switchback-ci@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix planner supersession and sketch recovery"
          git push origin HEAD:fix/prebeta-hold-20260906
