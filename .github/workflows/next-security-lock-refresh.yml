name: Temporary Next security lock refresh

on:
  push:
    branches:
      - ux/v2-1-premium-mobile-polish

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/v2-1-premium-mobile-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate patched dependency lock
        run: |
          set -euo pipefail
          npm pkg set dependencies.next=16.3.3
          npm install --package-lock-only --ignore-scripts
          node -e 'const p=require("./package.json"); if (p.dependencies.next !== "16.3.3") process.exit(1)'
          node -e 'const p=require("./package-lock.json"); if (p.packages[""].dependencies.next !== "16.3.3") process.exit(1)'
      - name: Commit patched manifest and lockfile
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): patch Next.js to 16.3.3"
          git push origin HEAD:ux/v2-1-premium-mobile-polish
