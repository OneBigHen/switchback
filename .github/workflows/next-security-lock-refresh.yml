name: Temporary dependency audit diagnostic

on:
  push:
    branches:
      - ux/v2-1-premium-mobile-polish

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Report dependency audit
        run: |
          set +e
          npm audit --json
          code=$?
          echo "npm-audit-exit=$code"
          exit 0
