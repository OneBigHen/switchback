name: Temporary dependency audit diagnostic

on:
  push:
    branches:
      - ux/v2-1-premium-mobile-polish

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Trace browserslist dependency and fix plan
        run: |
          set +e
          echo '=== browserslist tree ==='
          npm ls browserslist --all
          echo '=== current and latest browserslist ==='
          node -e 'const p=require("./package-lock.json"); console.log("locked",p.packages["node_modules/browserslist"]?.version)'
          npm view browserslist version
          echo '=== audit fix dry run ==='
          npm audit fix --package-lock-only --ignore-scripts --dry-run
          exit 0
